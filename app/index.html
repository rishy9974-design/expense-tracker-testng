<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker - Expense Tracker System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-title">
            <span class="nav-icon">&#8377;</span>
            <div>
                <h1>ExpenseTracker</h1>
                <small>Personal Finance &amp; Automated TestNG Verification</small>
            </div>
        </div>
        <div class="kpi-strip">
            <div class="kpi-box">
                <span class="kpi-label">SHOWN RECORDS</span>
                <strong id="summary">4 of 4 expenses shown</strong>
            </div>
            <div class="kpi-box accent">
                <span class="kpi-label">TOTAL AMOUNT</span>
                <strong id="totalAmount">Total: Rs. 2650</strong>
            </div>
        </div>
    </nav>

    <main class="workspace">
        <section class="panel entry-bar">
            <h2>Record New Expense</h2>
            <form id="expenseForm" class="entry-form">
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g. Cloud Server Lab Pass" required>
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Academic">Academic</option>
                    </select>
                </div>
                <div class="field">
                    <label for="amount">Amount (Rs.)</label>
                    <input type="number" id="amount" value="250" min="1" required>
                </div>
                <div class="field">
                    <label for="date">Date</label>
                    <input type="date" id="date" value="2026-10-20" required>
                </div>
                <div class="field wide">
                    <label for="notes">Reference / Notes</label>
                    <input type="text" id="notes" placeholder="Payment mode or bill details">
                </div>
                <div class="field action">
                    <button type="submit" id="saveBtn">Save expense</button>
                </div>
            </form>
        </section>

        <section class="panel ledger-panel">
            <div class="filter-row">
                <div class="tabs" id="chips"></div>
                <input type="text" id="search" placeholder="Filter by title or reference...">
            </div>

            <table class="ledger-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Expense Title</th>
                        <th>Category</th>
                        <th>Reference Notes</th>
                        <th>Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expenseList"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
